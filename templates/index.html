<!DOCTYPE html>
<html>

<head>

<title>pdf.bee</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#FFD21F;
font-family:Arial;
margin:0;
}

.header{
background:black;
color:white;
text-align:center;
padding:18px;
font-size:28px;
font-weight:bold;
}

.card{
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.preview{
margin-top:10px;
}

.file-card{
background:white;
padding:8px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
font-size:13px;
display:inline-block;
margin:5px;
}

.spinner-box{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.spinner{
width:60px;
height:60px;
border:6px solid #fff;
border-top:6px solid #FFD21F;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

</style>

</head>

<body>

<div class="header">
🐝 pdf.bee
</div>

<div class="spinner-box" id="loadingSpinner">
<div class="spinner"></div>
</div>

<div class="container text-center mt-4">

<div class="row g-4">

<!-- PDF TO IMAGE -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF → Image</h5>

<form action="/pdf_to_image" method="post" enctype="multipart/form-data">

<input type="file" id="pdfInput" name="pdf" accept=".pdf" class="form-control" required>

<div id="pdfPreview" class="preview"></div>

<button class="btn btn-warning mt-3">Convert & Download</button>

</form>

</div>
</div>


<!-- IMAGE TO PDF -->

<div class="col-md-4">
<div class="card p-3">

<h5>Image → PDF</h5>

<form action="/image_to_pdf" method="post" enctype="multipart/form-data">

<input type="file" id="imageInput" name="images" accept="image/*" multiple class="form-control" required>

<div id="imagePreview" class="preview"></div>

<button class="btn btn-warning mt-3">Convert & Download</button>

</form>

</div>
</div>


<!-- PDF MERGE -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF Merge</h5>

<form action="/merge_pdf" method="post" enctype="multipart/form-data">

<input type="file" id="mergeInput" name="pdfs" accept=".pdf" multiple class="form-control" required>

<div id="mergePreview" class="preview"></div>

<button class="btn btn-warning mt-3">Merge</button>

</form>

</div>
</div>


<!-- PDF SPLIT -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF Split</h5>

<form action="/split_pdf" method="post" enctype="multipart/form-data">

<input type="file" name="pdf" accept=".pdf" class="form-control" required>

<button class="btn btn-warning mt-3">Split</button>

</form>

</div>
</div>


<!-- PDF ROTATE -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF Rotate</h5>

<form action="/rotate_pdf" method="post" enctype="multipart/form-data">

<input type="file" name="pdf" accept=".pdf" class="form-control" required>

<button class="btn btn-warning mt-3">Rotate</button>

</form>

</div>
</div>


<!-- PDF WATERMARK -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF Watermark</h5>

<form action="/watermark_pdf" method="post" enctype="multipart/form-data">

<input type="file" name="pdf" accept=".pdf" class="form-control" required>

<button class="btn btn-warning mt-3">Watermark</button>

</form>

</div>
</div>


<!-- PDF COMPRESS -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF Compress</h5>

<form action="/compress_pdf" method="post" enctype="multipart/form-data">

<input type="file" name="pdf" accept=".pdf" class="form-control" required>

<button class="btn btn-warning mt-3">Compress</button>

</form>

</div>
</div>


<!-- PDF UNLOCK -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF Unlock</h5>

<form action="/unlock_pdf" method="post" enctype="multipart/form-data">

<input type="file" name="pdf" accept=".pdf" class="form-control" required>

<button class="btn btn-warning mt-3">Unlock</button>

</form>

</div>
</div>


<!-- PDF TO DOCX -->

<div class="col-md-4">
<div class="card p-3">

<h5>PDF → DOCX</h5>

<form action="/pdf_to_doc" method="post" enctype="multipart/form-data">

<input type="file" name="pdfdoc" accept=".pdf" class="form-control" required>

<button class="btn btn-warning mt-3">Convert</button>

</form>

</div>
</div>


<!-- DOCX TO PDF -->

<div class="col-md-4">
<div class="card p-3">

<h5>DOCX → PDF</h5>

<form action="/doc_to_pdf" method="post" enctype="multipart/form-data">

<input type="file" name="docfile" accept=".doc,.docx" class="form-control" required>

<button class="btn btn-warning mt-3">Convert</button>

</form>

</div>
</div>

</div>

</div>


<script>

function previewFiles(inputId,previewId){

const input=document.getElementById(inputId);
const preview=document.getElementById(previewId);

input.addEventListener("change",function(){

preview.innerHTML="";

Array.from(this.files).forEach(file=>{

const div=document.createElement("div");
div.className="file-card";
div.innerHTML="📄 "+file.name;

preview.appendChild(div);

});

});

}


document.querySelectorAll("form").forEach(form=>{

form.addEventListener("submit",function(){

document.getElementById("loadingSpinner").style.display="flex";

setTimeout(()=>{

form.reset();

document.querySelectorAll(".preview").forEach(p=>{
p.innerHTML="";
});

document.getElementById("loadingSpinner").style.display="none";

},2000);

});

});


previewFiles("pdfInput","pdfPreview");
previewFiles("imageInput","imagePreview");
previewFiles("mergeInput","mergePreview");

</script>

</body>
</html>
